services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: modulog
      POSTGRES_USER: modulog
      POSTGRES_PASSWORD: modulog_dev
    ports:
      - "5432:5432"
    volumes:
      - modulog-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulog -d modulog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  modulog-postgres:
